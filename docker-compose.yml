version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: sqlgenx-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=llama-3.3-70b-versatile
      - DATABASE_URL=postgresql://sqluser:sqlpass@postgres:5432/sqlgenx_db
      - READ_ONLY_MODE=True
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend

  frontend:
    image: node:20-alpine
    container_name: sqlgenx-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    container_name: sqlgenx-postgres
    environment:
      POSTGRES_USER: sqluser
      POSTGRES_PASSWORD: sqlpass
      POSTGRES_DB: sqlgenx_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sqlgenx-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
